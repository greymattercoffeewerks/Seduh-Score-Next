<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BTC Event Dashboard — preview</title>
    <link rel="stylesheet" href="/src/ui/tokens/index.css" />
    <link rel="stylesheet" href="/src/formats/btc/shared.css" />
    <link rel="stylesheet" href="/src/formats/btc/eventDashboardScreen.css" />
  </head>
  <body>
    <!--
      Demo-only harness for the BTC per-event dashboard — not part of the shipped
      module graph, same role as the other *.preview.html files in this directory.
      No live Supabase connection: an in-memory fake client stands in for the real one.
    -->
    <p>
      <button id="demo-normal">Mount (normal)</button>
      <button id="demo-test-event">Mount (test event)</button>
      <button id="demo-failed">Mount (load fails)</button>
    </p>
    <div id="app"></div>
    <script type="module">
      import { mountBtcEventDashboardScreen } from './eventDashboardScreen.js';

      function createDemoClient({ isTest = false, fail = false } = {}) {
        return {
          from: () => ({
            select: () => ({
              eq: () => ({
                single: () =>
                  fail
                    ? Promise.resolve({ data: null, error: { code: '42501', message: 'boom' } })
                    : Promise.resolve({
                        data: {
                          id: 'ev1',
                          name: 'Regional Bracket',
                          format: 'btc',
                          is_test: isTest,
                        },
                        error: null,
                      }),
              }),
            }),
          }),
        };
      }

      function mount(client) {
        document.getElementById('app').innerHTML = '';
        mountBtcEventDashboardScreen(document.getElementById('app'), { eventId: 'ev1', client });
      }

      document
        .getElementById('demo-normal')
        .addEventListener('click', () => mount(createDemoClient()));
      document
        .getElementById('demo-test-event')
        .addEventListener('click', () => mount(createDemoClient({ isTest: true })));
      document
        .getElementById('demo-failed')
        .addEventListener('click', () => mount(createDemoClient({ fail: true })));

      mount(createDemoClient());
    </script>
  </body>
</html>
