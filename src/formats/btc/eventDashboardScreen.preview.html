<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BTC Event Dashboard — preview</title>
    <link rel="stylesheet" href="/src/ui/tokens/index.css" />
    <link rel="stylesheet" href="/src/ui/tokens/components.css" />
    <link rel="stylesheet" href="/src/formats/btc/shared.css" />
    <link rel="stylesheet" href="/src/formats/btc/eventDashboardScreen.css" />
  </head>
  <body>
    <!--
      Demo-only harness for the BTC run-sheet dashboard (not part of the shipped module graph). No Supabase: an
      in-memory fake client answers every read. Pick a stage with the buttons, or ?stage=<name>[&shadow=1]
      (empty, blocked, round1, round2, cut, knockout, podium, test, failed).
    -->
    <p id="stages"></p>
    <div id="app"></div>
    <script type="module">
      import { mountBtcEventDashboardScreen } from './eventDashboardScreen.js';

      const STAGES = ['empty', 'blocked', 'round1', 'round2', 'cut', 'knockout', 'podium', 'test', 'failed'];
      const COUNTRIES = ['BN', 'MY', 'SG', 'ID', 'TH', 'PH', 'VN', 'KH', 'LA', 'MM'];

      const teams = (n, missing = 0) =>
        Array.from({ length: n }, (_, i) => ({
          id: `t${i + 1}`,
          name: `Team ${i + 1}`,
          country_code: i < n - missing ? COUNTRIES[i % COUNTRIES.length] : null,
        }));
      const judges = (n) =>
        Array.from({ length: n }, (_, i) => ({ id: `j${i + 1}`, name: `Judge ${i + 1}`, country_code: null }));

      let seq = 0;
      const match = (round, status, extra = {}) => ({
        id: `m${++seq}`,
        event_id: 'ev1',
        round: 'preliminary',
        prelim_round: round,
        status,
        team1_id: `t${(seq % 19) + 1}`,
        team2_id: `t${((seq + 7) % 19) + 1}`,
        team1_time_note: '8:42',
        team2_time_note: '9:10',
        ...extra,
      });
      const prelim = (r1, r2) => [
        ...Array.from({ length: 10 }, (_, i) => match(1, i < r1 ? 'confirmed' : i === r1 ? 'scoring' : 'pending')),
        ...Array.from({ length: r2 === null ? 0 : 10 }, (_, i) => match(2, i < r2 ? 'confirmed' : 'pending')),
      ];

      const seedingTie = () =>
        Array.from({ length: 12 }, (_, i) => ({
          team_id: `t${i + 1}`,
          seed: i + 1,
          wins: i === 7 || i === 8 ? 4 : 8 - (i % 4),
          total_points: i === 7 || i === 8 ? 20 : 40 - i,
          tied_count: i === 7 || i === 8 ? 2 : 1,
          tiebreak_rank: null,
          reason: null,
          group_resolved: false,
        }));

      const slot = (round, label, status, extra = {}) => ({
        id: `s-${label}`,
        event_id: 'ev1',
        round,
        slot_label: label,
        team1_id: 't1',
        team2_id: 't2',
        match_id: status ? `k-${label}` : null,
        _status: status,
        ...extra,
      });
      const bracket = ({ qf, sf, final, third }) => [
        ...['qf1', 'qf2', 'qf3', 'qf4'].map((l) => slot('quarterfinal', l, qf)),
        ...['sf1', 'sf2'].map((l) => slot('semifinal', l, sf)),
        slot('final', 'final', final),
        slot('third_place', 'third_place', third),
      ];

      function scenario(stage, shadow) {
        const event = {
          id: 'ev1',
          org_id: 'org1',
          name: 'ABTC Preliminary 2027',
          format: 'btc',
          is_test: stage === 'test',
          is_shadow: shadow && stage !== 'test',
          event_date: '2027-03-14',
          venue: 'Hall A',
          city: 'Bandar Seri Begawan',
        };
        const s = { events: event, teams: teams(20), judges: judges(9), matches: [], slots: [], seeding: [], scores: [], live: null };
        if (stage === 'empty') Object.assign(s, { teams: [], judges: [] });
        if (stage === 'blocked') s.teams = teams(20, 2);
        if (stage === 'round1') s.matches = prelim(7, null);
        if (stage === 'round2') s.matches = prelim(10, 4);
        if (stage === 'cut') {
          s.matches = prelim(10, 10);
          s.seeding = seedingTie();
        }
        if (stage === 'knockout') {
          s.matches = prelim(10, 10);
          s.slots = bracket({ qf: 'confirmed', sf: 'scoring', final: null, third: null });
        }
        if (stage === 'podium') {
          s.matches = prelim(10, 10);
          s.slots = bracket({ qf: 'confirmed', sf: 'confirmed', final: 'confirmed', third: 'confirmed' });
          s.scores = [
            { match_id: 'k-final', status: 'confirmed', team1_id: 't1', team2_id: 't2', team1_total: 30, team2_total: 20 },
            { match_id: 'k-third_place', status: 'confirmed', team1_id: 't3', team2_id: 't4', team1_total: 25, team2_total: 22 },
          ];
        }
        if (stage !== 'empty' && stage !== 'blocked') s.live = { event_id: stage === 'round2' ? 'ev1' : null };
        return s;
      }

      function createClient(s, fail) {
        const answer = (table) => {
          if (fail) return { data: null, error: { code: '42501', message: 'boom' } };
          switch (table) {
            case 'events': return { data: s.events, error: null };
            case 'btc_teams': return { data: s.teams, error: null };
            case 'btc_judges': return { data: s.judges, error: null };
            case 'btc_matches': {
              // Slot matches are read by id (status only); the roster read has no slot rows.
              return { data: [...s.matches, ...s.slots.filter((x) => x._status).map((x) => ({ id: x.match_id, status: x._status, round: 'quarterfinal' }))], error: null };
            }
            case 'btc_match_judges': return { data: s.matches.flatMap((m) => ['j1', 'j2', 'j3'].map((j) => ({ match_id: m.id, judge_id: j }))), error: null };
            case 'btc_bracket_slots': return { data: s.slots, error: null };
            case 'btc_match_scores': return { data: s.scores, error: null };
            case 'btc_seeding_order': return { data: s.seeding, error: null };
            case 'live_sessions': return { data: s.live, error: null };
            case 'events_flag': return { data: null, error: null };
            default: return { data: [], error: null };
          }
        };
        return {
          rpc: () => Promise.resolve({ data: { demo: true }, error: null }),
          from: (table) => {
            const builder = {
              select: () => builder,
              eq: () => builder,
              in: () => builder,
              order: () => builder,
              single: () => Promise.resolve(answer(table)),
              maybeSingle: () => Promise.resolve(answer(table)),
              then: (res, rej) => Promise.resolve(answer(table)).then(res, rej),
            };
            return builder;
          },
        };
      }

      const params = new URLSearchParams(location.search);
      const shadow = params.get('shadow') === '1';
      function mount(stage) {
        seq = 0;
        document.getElementById('app').innerHTML = '';
        mountBtcEventDashboardScreen(document.getElementById('app'), {
          eventId: 'ev1',
          client: createClient(scenario(stage, shadow), stage === 'failed'),
          handlers: {},
          listQueued: async () => (stage === 'round2' ? [{ type: 'confirm_btc_match', payload: { p_match_id: 'm14' } }] : []),
          audienceLinks: {
            phone: 'https://www.seduhscore.com/#/live/demo/phone',
            projector: 'https://www.seduhscore.com/#/live/demo/projector',
            splash: 'https://www.seduhscore.com/#/live/demo/splash',
          },
        });
      }
      for (const stage of STAGES) {
        const b = document.createElement('button');
        b.textContent = stage;
        b.addEventListener('click', () => mount(stage));
        document.getElementById('stages').append(b, ' ');
      }
      mount(params.get('stage') ?? 'round2');
    </script>
  </body>
</html>
