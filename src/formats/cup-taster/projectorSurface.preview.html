<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Projector surface — preview</title>
    <link rel="stylesheet" href="/src/ui/tokens/index.css" />
    <link rel="stylesheet" href="/src/core/viewer-shell.css" />
    <link rel="stylesheet" href="/src/core/stageDisplay.css" />
    <link rel="stylesheet" href="/src/core/stageSurface.css" />
    <link rel="stylesheet" href="/src/core/stageMoments.css" />
    <link rel="stylesheet" href="/src/core/countdownDisplay.css" />
    <link rel="stylesheet" href="/src/formats/cup-taster/heatsScreen.css" />
    <link rel="stylesheet" href="/src/formats/cup-taster/standingsScreen.css" />
    <link rel="stylesheet" href="/src/formats/cup-taster/viewerBody.css" />
    <link rel="stylesheet" href="/src/formats/cup-taster/projectorScreens.css" />
    <link rel="stylesheet" href="/src/formats/cup-taster/projectorMoments.css" />
    <style>
      /* Demo-harness-only layout — not part of the shipped module graph. The real surface fills the screen
         and every size in it is in vh/vw, so the harness gives it the whole browser window (resize the
         window to try a 1080p, 720p or 4:3 screen) and floats its buttons over the bottom edge. */
      body {
        margin: 0;
      }
      .demo-controls {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 50;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        padding: 8px 12px;
        background: rgba(0, 0, 0, 0.85);
        font-family: var(--font-body);
      }
      .demo-controls button {
        min-height: 36px;
        padding: 4px 10px;
        border: 1px solid #8fa7a9;
        background: #16393a;
        color: #f2f7f6;
        font-family: var(--font-body);
        font-size: 13px;
        cursor: pointer;
      }
      #projector-frame {
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <!--
      Demo-only harness for the projector surface — not part of the shipped module graph, same role as every
      other *.preview.html file. Mounts the REAL mountProjectorSurface() (viewer-shell + the projector body,
      showChrome: false, data-surface="stage") against a fake live_sessions source, with a button per screen:
      the heat on stage (live countdown), the urgent countdown, a hand-timed heat, being scored, the idle
      loop (an "up next" page and 17 cuppers in pages of 8, with the page-change ring), the champion, and the
      TEST-event banner. Resize the window to try other screen shapes.
    -->
    <div class="demo-controls">
      <button id="btn-idle">Idle loop (up next + 17 cuppers)</button>
      <button id="btn-standings-only">Standings only (4 cuppers)</button>
      <button id="btn-active-heat">Heat on stage (live countdown)</button>
      <button id="btn-urgent">Heat, under 10s (urgent)</button>
      <button id="btn-six">Heat, 6 stations, long names</button>
      <button id="btn-manual-no-clock">Heat timed by hand</button>
      <button id="btn-scoring">Being scored</button>
      <button id="btn-moments">Heat confirmed (result + rank impact)</button>
      <button id="btn-moments-six">Heat confirmed (6 cuppers, long names, ties)</button>
      <button id="btn-champion">Champion</button>
      <button id="btn-test-event">As TEST event</button>
      <button id="btn-end">End session</button>
      <button id="btn-disconnect">Simulate disconnect</button>
      <button id="btn-reconnect">Reconnect</button>
    </div>
    <div id="projector-frame"></div>

    <script type="module">
      import { mountProjectorSurface } from './projectorSurface.js';
      import { buildActiveHeatPayload } from './demoActiveHeatPayload.js';

      const ORG_ID = 'org1';
      const EVENT_ID = 'ev1';

      function createDemoClient() {
        // events defaults to one row for ORG_ID — this harness demonstrates
        // real published content, not the noEvent/notStarted distinction
        // (see viewer-shell.preview.html for that).
        const db = { live_sessions: [], events: [{ id: EVENT_ID, org_id: ORG_ID }] };
        let idCounter = 0;
        const changeHandlers = [];
        const statusHandlers = [];

        function matchesFilters(row, filters) {
          return filters.every(([col, val]) => row[col] === val);
        }

        function notifyChange() {
          for (const h of changeHandlers) h();
        }

        function makeBuilder(table) {
          const filters = [];
          const builder = {
            select: () => builder,
            eq(col, val) {
              filters.push([col, val]);
              return builder;
            },
            order: () => builder,
            limit: () => builder,
            maybeSingle() {
              const rows = db[table].filter((r) => matchesFilters(r, filters));
              return Promise.resolve({ data: rows[0] ?? null, error: null });
            },
          };
          return builder;
        }

        const channelObj = {
          on(_event, _filter, handler) {
            changeHandlers.push(handler);
            return channelObj;
          },
          subscribe(cb) {
            statusHandlers.push(cb);
            Promise.resolve().then(() => cb('SUBSCRIBED'));
            return channelObj;
          },
        };

        return {
          from: (table) => makeBuilder(table),
          channel: () => channelObj,
          removeChannel: () => {},
          _publish({ isTest = false, payload }) {
            for (const row of db.live_sessions) {
              if (row.org_id === ORG_ID) row.active = false;
            }
            let row = db.live_sessions.find((r) => r.event_id === EVENT_ID);
            if (!row) {
              idCounter += 1;
              row = { id: `ls-${idCounter}`, org_id: ORG_ID, event_id: EVENT_ID };
              db.live_sessions.push(row);
            }
            Object.assign(row, { format: 'cup_taster', active: true, is_test: isTest, payload });
            notifyChange();
          },
          _end() {
            for (const row of db.live_sessions) {
              if (row.org_id === ORG_ID) row.active = false;
            }
            notifyChange();
          },
          _setStatus(status) {
            for (const h of statusHandlers) h(status);
          },
        };
      }

      const client = createDemoClient();
      mountProjectorSurface(document.getElementById('projector-frame'), { orgId: ORG_ID, client });

      const EVENT_NAME = 'Grey Matter Cup Taster Competition 2026';
      const NAMES = [
        'Wilky Derikson Gultom',
        'Taufiq Manan',
        'Hazman Husin',
        'Hadziq Hr',
        'Ayu Pratiwi',
        'Bima Santoso',
        'Dian Kusuma',
        'Fajar Wibowo',
        'Gita Lestari',
        'Hendra Wijaya',
        'Indah Permata',
        'Joko Susilo',
        'Kartika Sari',
        'Lukman Hakim',
        'Maya Anggraini',
        'Naufal Rahman',
        'Oka Pradana',
      ];
      const standings17 = NAMES.map((displayName, i) => ({
        position: i < 2 ? 1 : i + 1,
        displayName,
        numCorrect: Math.max(0, 3 - Math.floor(i / 3)),
        totalElapsedSecs: i < 15 ? 235 + i * 14 : null,
        tieStatus: i < 2 ? 'tied' : null,
      }));
      const standings = [
        {
          position: 1,
          displayName: 'Alex Rivera',
          numCorrect: 5,
          totalElapsedSecs: 210,
          tieStatus: 'advancing',
        },
        {
          position: 2,
          displayName: 'Jordan Lee',
          numCorrect: 5,
          totalElapsedSecs: 245,
          tieStatus: 'tied',
        },
        { position: 3, displayName: 'Sam Okafor', numCorrect: 3, totalElapsedSecs: 300 },
        { position: 4, displayName: 'Priya Nair', numCorrect: 1, totalElapsedSecs: null },
      ];
      const upNext = {
        heatNumber: 4,
        stageKind: 'prelims',
        cuppers: [
          { displayName: 'Ayu Pratiwi', station: 'A' },
          { displayName: 'Bima Santoso', station: 'B' },
          { displayName: 'Dian Kusuma', station: 'C' },
          { displayName: 'Fajar Wibowo', station: 'D' },
        ],
      };
      const base = { eventName: EVENT_NAME, stage: { kind: 'prelims', setCount: 5 } };

      document.getElementById('btn-idle').addEventListener('click', () => {
        client._publish({ payload: { ...base, standings: standings17, upNext } });
      });
      document.getElementById('btn-standings-only').addEventListener('click', () => {
        client._publish({ payload: { ...base, standings } });
      });
      document.getElementById('btn-active-heat').addEventListener('click', () => {
        client._publish({
          payload: {
            ...buildActiveHeatPayload(new Date().toISOString(), 480, standings17),
            eventName: EVENT_NAME,
            upNext,
          },
        });
      });
      document.getElementById('btn-urgent').addEventListener('click', () => {
        client._publish({
          payload: {
            ...base,
            standings,
            activeHeat: {
              heatNumber: 2,
              stageKind: 'prelims',
              status: 'timing',
              timingMode: 'app',
              startedAt: new Date(Date.now() - 473000).toISOString(),
              durationSecs: 480,
              cuppers: [
                { displayName: 'Jordan Lee', station: 'A', totalElapsedSecs: null, maxed: false },
              ],
            },
          },
        });
      });
      document.getElementById('btn-six').addEventListener('click', () => {
        const longNames = [
          'Muhammad Alexander Wilkinson-Gultom Santoso',
          'Taufiq',
          'Hazmanhusinbinabdulrahmanalhaj',
          'Dr. Siti Nurhaliza binti Mohd Yusoff',
          'Ayu',
          'Bima Santoso Prakoso',
        ];
        client._publish({
          payload: {
            ...base,
            standings,
            activeHeat: {
              heatNumber: 5,
              kind: 'tiebreak',
              stageKind: 'prelims',
              status: 'timing',
              timingMode: 'app',
              startedAt: new Date().toISOString(),
              durationSecs: 480,
              cuppers: longNames.map((displayName, i) => ({
                displayName,
                station: String.fromCharCode(65 + i),
                totalElapsedSecs: i === 1 ? 190 : null,
                maxed: false,
              })),
            },
          },
        });
      });
      document.getElementById('btn-manual-no-clock').addEventListener('click', () => {
        client._publish({
          payload: {
            ...base,
            standings,
            activeHeat: {
              heatNumber: 3,
              stageKind: 'prelims',
              status: 'timing',
              timingMode: 'manual',
              startedAt: null,
              durationSecs: 480,
              cuppers: [
                { displayName: 'Morgan Diaz', station: 'A', totalElapsedSecs: null, maxed: false },
                { displayName: 'Casey Wu', station: 'B', totalElapsedSecs: null, maxed: false },
              ],
            },
          },
        });
      });
      document.getElementById('btn-scoring').addEventListener('click', () => {
        client._publish({
          payload: {
            ...base,
            standings: standings17,
            upNext,
            activeHeat: {
              heatNumber: 3,
              stageKind: 'prelims',
              status: 'scoring',
              timingMode: 'app',
              startedAt: new Date(Date.now() - 500000).toISOString(),
              durationSecs: 480,
              cuppers: [
                { displayName: 'Jordan Lee', station: 'A', totalElapsedSecs: 400, maxed: false },
              ],
            },
          },
        });
      });
      // The two "moments": publishes the table as it stood, then — as a later snapshot, the way the organiser's
      // confirm does — the same stage with a new confirmed heat and a moved table.
      function publishConfirmedHeat({ heatResults, after }) {
        client._publish({ payload: { ...base, standings: standings17, upNext } });
        setTimeout(() => {
          client._publish({
            payload: {
              ...base,
              standings: after,
              upNext,
              recentHeats: [
                { heatNumber: 3, kind: 'normal', stageKind: 'prelims', results: heatResults },
              ],
            },
          });
        }, 400);
      }
      const rowFor = (position, displayName, numCorrect, totalElapsedSecs, extra = {}) => ({
        position,
        displayName,
        numCorrect,
        totalElapsedSecs,
        tieStatus: null,
        ...extra,
      });
      document.getElementById('btn-moments').addEventListener('click', () => {
        const heatResults = [
          { displayName: 'Ayu Pratiwi', numCorrect: 5, totalElapsedSecs: 221 },
          { displayName: 'Bima Santoso', numCorrect: 4, totalElapsedSecs: 240 },
          { displayName: 'Dian Kusuma', numCorrect: 5, totalElapsedSecs: 205 },
          { displayName: 'Fajar Wibowo', numCorrect: 2, totalElapsedSecs: 300 },
        ];
        publishConfirmedHeat({
          heatResults,
          after: [
            rowFor(1, 'Dian Kusuma', 5, 205),
            rowFor(2, 'Ayu Pratiwi', 5, 221),
            ...standings17.slice(0, 3).map((r, i) => ({ ...r, position: 3 + i })),
            rowFor(6, 'Bima Santoso', 4, 240),
          ],
        });
      });
      document.getElementById('btn-moments-six').addEventListener('click', () => {
        const longNames = [
          'Muhammad Alexander Wilkinson-Gultom Santoso',
          'Taufiq',
          'Hazmanhusinbinabdulrahmanalhaj',
          'Dr. Siti Nurhaliza binti Mohd Yusoff',
          'Ayu',
          'Bima Santoso Prakoso',
        ];
        const heatResults = longNames.map((displayName, i) => ({
          displayName,
          numCorrect: i < 2 ? 5 : 3,
          totalElapsedSecs: i < 2 ? 200 : 250 + i,
        }));
        publishConfirmedHeat({
          heatResults,
          after: [
            rowFor(1, longNames[0], 5, 200),
            rowFor(1, longNames[1], 5, 200),
            rowFor(3, longNames[2], 3, 252),
            rowFor(4, longNames[3], 3, 253),
            rowFor(5, longNames[4], 3, 254),
            rowFor(5, longNames[5], 3, 254),
            rowFor(5, 'Zed Tied Fifth One', 3, 254),
            rowFor(5, 'Zed Tied Fifth Two', 3, 254),
            rowFor(5, 'Zed Tied Fifth Three', 3, 254),
          ],
        });
      });
      document.getElementById('btn-champion').addEventListener('click', () => {
        client._publish({
          payload: {
            eventName: EVENT_NAME,
            stage: { kind: 'finals', setCount: 7 },
            standings: [
              {
                position: 1,
                displayName: 'Wilky Derikson Gultom',
                numCorrect: 3,
                totalElapsedSecs: 235,
              },
              { position: 2, displayName: 'Taufiq Manan', numCorrect: 3, totalElapsedSecs: 289 },
              { position: 3, displayName: 'Hazman Husin', numCorrect: 3, totalElapsedSecs: 376 },
            ],
            champion: 'Wilky Derikson Gultom',
          },
        });
      });

      document.getElementById('btn-test-event').addEventListener('click', () => {
        client._publish({
          isTest: true,
          payload: { ...base, standings },
        });
      });

      document.getElementById('btn-end').addEventListener('click', () => {
        client._end();
      });
      document.getElementById('btn-disconnect').addEventListener('click', () => {
        client._setStatus('CHANNEL_ERROR');
      });
      document.getElementById('btn-reconnect').addEventListener('click', () => {
        client._setStatus('SUBSCRIBED');
      });

      // e2e test hook only — tests/e2e/cross-surface-countdown.spec.js
      // publishes the exact same startedAt/durationSecs here as it reads
      // from the organiser's own timingScreen.preview.html (a separate
      // browser context), to prove genuine cross-context agreement on
      // remaining time rather than three independently-guessed timestamps.
      // Not part of the shipped module graph, same as everything else in
      // this harness.
      window.__e2e = {
        publishActiveHeat(startedAt, durationSecs) {
          client._publish({ payload: buildActiveHeatPayload(startedAt, durationSecs, standings) });
        },
      };
    </script>
  </body>
</html>
