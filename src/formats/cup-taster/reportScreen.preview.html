<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="/src/ui/tokens/index.css" />

  </head>
  <body>
    <!--
      Demo-only harness for the T4.7 report screen — not part of the shipped
      module graph, same role as standingsScreen.preview.html. A fully
      COMPLETED two-stage event (prelims -> finals): 4 cuppers in prelims,
      2 advance cleanly to finals, one of whom becomes champion. Exercises
      both stage sections, the standings-with-outcome table, set difficulty,
      and score distribution.
    -->
    <div id="app"></div>
    <script type="module">
      import { mountReportScreen } from './reportScreen.js';

      const db = {
        events: [{ id: 'ev1', org_id: 'org1', name: 'Autumn Cup Tasters', is_test: true }],
        ct_stages: [
          {
            id: 's1',
            event_id: 'ev1',
            ordinal: 1,
            kind: 'prelims',
            set_count: 3,
            cutoff: 2,
            status: 'complete',
          },
          {
            id: 's2',
            event_id: 'ev1',
            ordinal: 2,
            kind: 'finals',
            set_count: 3,
            cutoff: null,
            status: 'complete',
          },
        ],
        ct_stage_entries: [
          {
            id: 'se1',
            stage_id: 's1',
            entry_id: 'e1',
            source: 'seed',
            final_position: null,
            position_note: null,
          },
          {
            id: 'se2',
            stage_id: 's1',
            entry_id: 'e2',
            source: 'seed',
            final_position: null,
            position_note: null,
          },
          {
            id: 'se3',
            stage_id: 's1',
            entry_id: 'e3',
            source: 'seed',
            final_position: 3,
            position_note: null,
          },
          {
            id: 'se4',
            stage_id: 's1',
            entry_id: 'e4',
            source: 'seed',
            final_position: 3,
            position_note: null,
          },
          {
            id: 'se5',
            stage_id: 's2',
            entry_id: 'e1',
            source: 'advanced',
            final_position: 1,
            position_note: null,
          },
          {
            id: 'se6',
            stage_id: 's2',
            entry_id: 'e2',
            source: 'advanced',
            final_position: 2,
            position_note: null,
          },
        ],
        event_entries: [
          { id: 'e1', display_name: 'Alex Rivera' },
          { id: 'e2', display_name: 'Jordan Lee' },
          { id: 'e3', display_name: 'Sam Okafor' },
          { id: 'e4', display_name: 'Priya Nair' },
        ],
        ct_sets: [
          { id: 's1set1', stage_id: 's1', position: 1, label: null },
          { id: 's1set2', stage_id: 's1', position: 2, label: null },
          { id: 's1set3', stage_id: 's1', position: 3, label: null },
          { id: 's2set1', stage_id: 's2', position: 1, label: null },
          { id: 's2set2', stage_id: 's2', position: 2, label: null },
          { id: 's2set3', stage_id: 's2', position: 3, label: null },
        ],
        ct_heats: [
          { id: 'h1', stage_id: 's1', kind: 'normal', heat_number: 1, status: 'confirmed' },
          { id: 'h2', stage_id: 's2', kind: 'normal', heat_number: 1, status: 'confirmed' },
        ],
        ct_heat_entries: [
          { id: 'he1', heat_id: 'h1', entry_id: 'e1', elapsed_secs: 90 },
          { id: 'he2', heat_id: 'h1', entry_id: 'e2', elapsed_secs: 110 },
          { id: 'he3', heat_id: 'h1', entry_id: 'e3', elapsed_secs: 150 },
          { id: 'he4', heat_id: 'h1', entry_id: 'e4', elapsed_secs: 200 },
          { id: 'he5', heat_id: 'h2', entry_id: 'e1', elapsed_secs: 80 },
          { id: 'he6', heat_id: 'h2', entry_id: 'e2', elapsed_secs: 95 },
        ],
        ct_results: [
          // Prelims — set 2 turns out to be the hardest (only 1 of 4 correct).
          { heat_entry_id: 'he1', set_id: 's1set1', correct: true },
          { heat_entry_id: 'he1', set_id: 's1set2', correct: true },
          { heat_entry_id: 'he1', set_id: 's1set3', correct: true },
          { heat_entry_id: 'he2', set_id: 's1set1', correct: true },
          { heat_entry_id: 'he2', set_id: 's1set2', correct: false },
          { heat_entry_id: 'he2', set_id: 's1set3', correct: true },
          { heat_entry_id: 'he3', set_id: 's1set1', correct: true },
          { heat_entry_id: 'he3', set_id: 's1set2', correct: false },
          { heat_entry_id: 'he3', set_id: 's1set3', correct: false },
          { heat_entry_id: 'he4', set_id: 's1set1', correct: false },
          { heat_entry_id: 'he4', set_id: 's1set2', correct: false },
          { heat_entry_id: 'he4', set_id: 's1set3', correct: false },
          // Finals — Alex sweeps, Jordan misses one.
          { heat_entry_id: 'he5', set_id: 's2set1', correct: true },
          { heat_entry_id: 'he5', set_id: 's2set2', correct: true },
          { heat_entry_id: 'he5', set_id: 's2set3', correct: true },
          { heat_entry_id: 'he6', set_id: 's2set1', correct: true },
          { heat_entry_id: 'he6', set_id: 's2set2', correct: true },
          { heat_entry_id: 'he6', set_id: 's2set3', correct: false },
        ],
      };

      function matchesFilters(row, filters) {
        return filters.every(([type, col, val]) => {
          if (type === 'eq') return row[col] === val;
          if (type === 'in') return val.includes(row[col]);
          return true;
        });
      }

      // ct_standings is a real Postgres view in production, derived from
      // ct_results/ct_heat_entries/ct_heats — recomputed here the same way,
      // on every read, from the same raw facts analytics.js's own
      // computeSetDifficulty reads directly.
      function computeStandingsRows(stageId) {
        const heatsForStage = db.ct_heats.filter(
          (h) => h.stage_id === stageId && h.kind === 'normal',
        );
        const heatIds = new Set(heatsForStage.map((h) => h.id));
        const byEntry = new Map();
        for (const he of db.ct_heat_entries) {
          if (!heatIds.has(he.heat_id)) continue;
          const correct = db.ct_results.filter(
            (r) => r.heat_entry_id === he.id && r.correct,
          ).length;
          const scored = db.ct_results.filter((r) => r.heat_entry_id === he.id).length;
          const existing = byEntry.get(he.entry_id) ?? {
            correct_count: 0,
            sets_scored: 0,
            total_elapsed_secs: 0,
          };
          byEntry.set(he.entry_id, {
            correct_count: existing.correct_count + correct,
            sets_scored: existing.sets_scored + scored,
            total_elapsed_secs: existing.total_elapsed_secs + (he.elapsed_secs ?? 0),
          });
        }
        return [...byEntry.entries()].map(([entry_id, agg]) => ({
          entry_id,
          stage_id: stageId,
          ...agg,
        }));
      }

      function makeBuilder(table) {
        const filters = [];
        const builder = {
          select() {
            return builder;
          },
          eq(col, val) {
            filters.push(['eq', col, val]);
            return builder;
          },
          in(col, vals) {
            filters.push(['in', col, vals]);
            return builder;
          },
          order(col, { ascending } = {}) {
            const rows =
              table === 'ct_standings'
                ? computeStandingsRows(filters.find(([, c]) => c === 'stage_id')?.[2])
                : db[table].filter((r) => matchesFilters(r, filters));
            rows.sort((a, b) => (ascending ? a[col] - b[col] : b[col] - a[col]));
            db[`__ordered_${table}`] = rows;
            return builder;
          },
          single() {
            const rows = db[table].filter((r) => matchesFilters(r, filters));
            return Promise.resolve({ data: rows[0] ?? null, error: null });
          },
          maybeSingle() {
            const rows = db[table].filter((r) => matchesFilters(r, filters));
            return Promise.resolve({ data: rows[0] ?? null, error: null });
          },
          then(resolve, reject) {
            const rows =
              db[`__ordered_${table}`] ??
              (table === 'ct_standings'
                ? computeStandingsRows(filters.find(([, c]) => c === 'stage_id')?.[2])
                : db[table].filter((r) => matchesFilters(r, filters)));
            delete db[`__ordered_${table}`];
            return Promise.resolve({ data: rows, error: null }).then(resolve, reject);
          },
        };
        return builder;
      }

      const client = { from: (table) => makeBuilder(table) };

      mountReportScreen(document.getElementById('app'), { eventId: 'ev1', client });
    </script>
  </body>
</html>
