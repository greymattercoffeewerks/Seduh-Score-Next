<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Roster registration — preview</title>
    <link rel="stylesheet" href="/src/ui/tokens/index.css" />
    <link rel="stylesheet" href="/src/formats/cup-taster/heatsScreen.css" />
    <link rel="stylesheet" href="/src/formats/cup-taster/rosterScreen.css" />
  </head>
  <body>
    <!--
      Demo-only harness for the roster registration screen — not part of the
      shipped module graph, same role as setupScreen.preview.html/
      heatsScreen.preview.html. No live Supabase connection: an in-memory
      fake client (below) stands in for the real one. Seeded with two
      cuppers, one already withdrawn. Try: registering a new cupper (name +
      phone required), re-registering the same phone number (shows "already
      registered" rather than a duplicate), withdrawing/reinstating an
      entry, and Edit on a row (each row shows the phone/email on file; try
      giving one cupper the other's phone number to see the conflict message).
    -->
    <p>
      <button id="demo-normal">Mount (normal)</button>
      <button id="demo-failed">Mount (load fails)</button>
      <button id="demo-hung">Mount (load hangs — real 10s timeout)</button>
    </p>
    <div id="app"></div>
    <script type="module">
      import { mountRosterScreen } from './rosterScreen.js';

      function createDemoClient() {
        const db = {
          events: [{ id: 'ev1', org_id: 'org1', name: 'October Cup', is_test: true }],
          people: [
            {
              id: 'p1',
              org_id: 'org1',
              display_name: 'Alex Rivera',
              phone: '+6738001111',
              email: null,
              cafe: 'Grey Matter',
              country: null,
              notes: null,
            },
            {
              id: 'p2',
              org_id: 'org1',
              display_name: 'Jordan Lee',
              phone: '+6738002222',
              email: 'jordan@example.com',
              cafe: 'Coffee Cartel',
              country: null,
              notes: null,
            },
          ],
          event_entries: [
            {
              id: 'e1',
              event_id: 'ev1',
              person_id: 'p1',
              display_name: 'Alex Rivera',
              cafe: 'Grey Matter',
              bib: '1',
              withdrawn: false,
            },
            {
              id: 'e2',
              event_id: 'ev1',
              person_id: 'p2',
              display_name: 'Jordan Lee',
              cafe: 'Coffee Cartel',
              bib: '2',
              withdrawn: true,
            },
          ],
        };
        let idCounter = 0;

        function matchesFilters(row, filters) {
          return filters.every(([col, val]) =>
            Array.isArray(val) ? val.includes(row[col]) : row[col] === val,
          );
        }

        function makeBuilder(table) {
          const filters = [];

          const builder = {
            select() {
              return builder;
            },
            eq(col, val) {
              filters.push([col, val]);
              return builder;
            },
            ilike(col, val) {
              filters.push([col, val]);
              return builder;
            },
            in(col, vals) {
              filters.push([col, vals]);
              return builder;
            },
            insert(payload) {
              const rows = Array.isArray(payload) ? payload : [payload];
              const inserted = rows.map((row) => {
                idCounter += 1;
                return { id: `${table}-${idCounter}`, ...row };
              });
              db[table].push(...inserted);
              return {
                select: () => ({
                  single: () => Promise.resolve({ data: inserted[0], error: null }),
                  then: (resolve) => Promise.resolve({ data: inserted, error: null }).then(resolve),
                }),
              };
            },
            update(patch) {
              return {
                eq(col, val) {
                  let updated = null;
                  for (const row of db[table]) {
                    if (row[col] === val) {
                      Object.assign(row, patch);
                      updated = row;
                    }
                  }
                  return {
                    select: () => ({
                      single: () => Promise.resolve({ data: updated, error: null }),
                    }),
                  };
                },
              };
            },
            single() {
              const rows = db[table].filter((r) => matchesFilters(r, filters));
              return Promise.resolve({ data: rows[0] ?? null, error: null });
            },
            maybeSingle() {
              const rows = db[table].filter((r) => matchesFilters(r, filters));
              return Promise.resolve({ data: rows[0] ?? null, error: null });
            },
            then(resolve, reject) {
              const rows = db[table].filter((r) => matchesFilters(r, filters));
              return Promise.resolve({ data: rows, error: null }).then(resolve, reject);
            },
          };
          return builder;
        }

        // Stand-in for the update_roster_entry RPC (migration 20261007100000): the person's profile
        // and this event's entry change together; a phone/email another person has is a P0002
        // conflict whose details name the field and the person.
        function rpc(name, args) {
          if (name !== 'update_roster_entry') return Promise.resolve({ data: null, error: null });
          const entry = db.event_entries.find((row) => row.id === args.p_entry_id);
          const clean = (v) => (typeof v === 'string' && v.trim() !== '' ? v.trim() : null);
          const person = entry?.person_id
            ? db.people.find((row) => row.id === entry.person_id)
            : null;
          if (person) {
            for (const [field, value] of [
              ['phone', clean(args.p_phone)],
              ['email', clean(args.p_email)],
            ]) {
              const other =
                value &&
                db.people.find(
                  (row) =>
                    row.id !== person.id &&
                    String(row[field] ?? '').toLowerCase() === value.toLowerCase(),
                );
              if (other) {
                return Promise.resolve({
                  data: null,
                  error: Object.assign(new Error('CONFLICT'), {
                    code: 'P0002',
                    details: JSON.stringify({ field, existing_display_name: other.display_name }),
                  }),
                });
              }
            }
            Object.assign(person, {
              display_name: clean(args.p_display_name),
              phone: clean(args.p_phone),
              email: clean(args.p_email),
              cafe: clean(args.p_cafe),
            });
          }
          Object.assign(entry, {
            display_name: clean(args.p_display_name),
            cafe: clean(args.p_cafe),
            bib: clean(args.p_bib),
          });
          return Promise.resolve({ data: null, error: null });
        }

        return { from: (table) => makeBuilder(table), rpc };
      }

      // Demo-only for the timeout/retry follow-up — not part of the shipped
      // module graph. Lets the actual timeout/error/retry UI be seen live,
      // not just inferred from the unit tests.
      function failingClient() {
        return { from: () => ({ from: () => {} }) };
      }
      function hungClient() {
        function builder() {
          const b = {
            select: () => b,
            eq: () => b,
            single: () => new Promise(() => {}),
            maybeSingle: () => new Promise(() => {}),
            then: () => new Promise(() => {}),
          };
          return b;
        }
        return { from: () => builder() };
      }

      function mount(client) {
        document.getElementById('app').innerHTML = '';
        mountRosterScreen(document.getElementById('app'), { eventId: 'ev1', client });
      }

      document
        .getElementById('demo-normal')
        .addEventListener('click', () => mount(createDemoClient()));
      document
        .getElementById('demo-failed')
        .addEventListener('click', () => mount(failingClient()));
      document.getElementById('demo-hung').addEventListener('click', () => mount(hungClient()));

      mount(createDemoClient());
    </script>
  </body>
</html>
