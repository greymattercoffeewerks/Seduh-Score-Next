<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Heat generation — preview</title>
    <link rel="stylesheet" href="/src/ui/tokens/index.css" />
    <link rel="stylesheet" href="/src/formats/cup-taster/heatsScreen.css" />
  </head>
  <body>
    <!--
      Demo-only harness for the T4.2 heat generation screen — not part of the
      shipped module graph, same role as src/ui/tokens/preview.html. No live
      Supabase connection: an in-memory fake client (below) stands in for the
      real one so this screen can be exercised and reviewed at 360px without
      needing an authenticated session, a real event, or seeded DB rows.
    -->
    <p>
      <button id="demo-fresh">Mount (fresh, no heats)</button>
      <button id="demo-partial">Mount (partial generation — needs resume)</button>
    </p>
    <div id="app"></div>
    <script type="module">
      import { mountHeatGenerationScreen } from './heatsScreen.js';

      function createDemoClient({ partial = false } = {}) {
        const db = {
          events: [{ id: 'ev1', org_id: 'org1', name: 'October Cup', is_test: true }],
          ct_stages: [
            {
              id: 's1',
              event_id: 'ev1',
              ordinal: 1,
              kind: 'prelims',
              set_count: 5,
              duration_secs: 480,
              cutoff: 8,
            },
          ],
          ct_stage_entries: [
            { id: 'se1', stage_id: 's1', entry_id: 'e1' },
            { id: 'se2', stage_id: 's1', entry_id: 'e2' },
            { id: 'se3', stage_id: 's1', entry_id: 'e3' },
            { id: 'se4', stage_id: 's1', entry_id: 'e4' },
          ],
          event_entries: [
            {
              id: 'e1',
              event_id: 'ev1',
              display_name: 'Alex Rivera',
              cafe: 'Grey Matter Coffee',
              bib: '1',
              withdrawn: false,
            },
            {
              id: 'e2',
              event_id: 'ev1',
              display_name: 'Jordan Lee',
              cafe: 'Roast & Ritual',
              bib: '2',
              withdrawn: false,
            },
            {
              id: 'e3',
              event_id: 'ev1',
              display_name: 'Sam Okafor',
              cafe: 'Third Wave Collective',
              bib: '3',
              withdrawn: false,
            },
            {
              id: 'e4',
              event_id: 'ev1',
              display_name: 'Priya Nair',
              cafe: 'Grey Matter Coffee',
              bib: '4',
              withdrawn: false,
            },
            {
              id: 'e5',
              event_id: 'ev1',
              display_name: 'Casey Morgan',
              cafe: 'Sundown Roasters',
              bib: '5',
              withdrawn: true, // withdrawn — must NOT appear after seeding
            },
          ],
          // Demo-only for the resumability follow-up — heat 1 exists with
          // only Alex Rivera placed (the exact shape a partial
          // generateHeatsRandom failure leaves: createHeats has no
          // batch-level atomicity), Jordan Lee/Sam Okafor/Priya Nair still
          // need a heat.
          ct_heats: partial
            ? [
                {
                  id: 'h1',
                  stage_id: 's1',
                  heat_number: 1,
                  kind: 'normal',
                  timing_mode: 'app',
                  status: 'pending',
                  duration_secs: 480,
                },
              ]
            : [],
          ct_heat_entries: partial
            ? [{ id: 'he1', heat_id: 'h1', entry_id: 'e1', station: 'A' }]
            : [],
        };

        function matchesFilters(row, filters) {
          return filters.every(([col, val]) => row[col] === val);
        }

        function makeBuilder(table) {
          const filters = [];
          let orderCol = null;

          const builder = {
            select() {
              return builder;
            },
            eq(col, val) {
              filters.push([col, val]);
              return builder;
            },
            order(col) {
              orderCol = col;
              return builder;
            },
            insert(payload) {
              const rows = Array.isArray(payload) ? payload : [payload];
              const inserted = rows.map((row) => ({
                id: `${table}-${db[table].length}-${Math.random().toString(36).slice(2, 8)}`,
                ...row,
              }));
              db[table].push(...inserted);
              return {
                select: () => ({
                  single: () => Promise.resolve({ data: inserted[0], error: null }),
                  then: (resolve) => Promise.resolve({ data: inserted, error: null }).then(resolve),
                }),
              };
            },
            single() {
              const rows = db[table].filter((r) => matchesFilters(r, filters));
              return Promise.resolve({ data: rows[0] ?? null, error: null });
            },
            maybeSingle() {
              const rows = db[table].filter((r) => matchesFilters(r, filters));
              return Promise.resolve({ data: rows[0] ?? null, error: null });
            },
            then(resolve, reject) {
              let rows = db[table].filter((r) => matchesFilters(r, filters));
              if (orderCol) rows = [...rows].sort((a, b) => (a[orderCol] > b[orderCol] ? 1 : -1));
              return Promise.resolve({ data: rows, error: null }).then(resolve, reject);
            },
          };
          return builder;
        }

        return { from: (table) => makeBuilder(table) };
      }

      function mount(client) {
        document.getElementById('app').innerHTML = '';
        mountHeatGenerationScreen(document.getElementById('app'), {
          eventId: 'ev1',
          stageId: 's1',
          client,
        });
      }

      document
        .getElementById('demo-fresh')
        .addEventListener('click', () => mount(createDemoClient()));
      document
        .getElementById('demo-partial')
        .addEventListener('click', () => mount(createDemoClient({ partial: true })));

      mount(createDemoClient());
    </script>
  </body>
</html>
